[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-aneurysm"
version = "0.1.0"
description = "RSNA intracranial aneurysm detection — training, metrics, and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bempong-Sylvester-Obese" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydicom>=2.4",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "albumentations>=1.3",
    "torch>=2.0",
    "tqdm>=4.65",
    "typer>=0.9",
    "rich>=13.0",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
rsna-aneurysm = "rsna_aneurysm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
